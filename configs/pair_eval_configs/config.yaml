# the templeate of pair_eval_config
# user should careful the param:
# eval_id
# rna_config, ga_config, rna_checkpoint_path, ga_checkpoint_path, use_pretrained
# log_dir, save_dir recomment to be the same as the training function will add prefix
# use_pretrained must be the same 



eval_id: 1 #1,2,3,4
phase_1_params:
  batch_size: 2048
  rna_config:
  ga_config:
  rna_checkpoint_path:
  ga_checkpoint_path:
  use_pretrained: True
  log_dir:
  save_dir:
  training_steps: 1600
  lr: 1.0e-5
  device: "cuda"

phase_2_params:
  batch_size: 2048
  use_pretrained: True
  log_dir:
  save_dir:
  training_steps: 1600
  eval_steps: 100
  save_steps: 400
  lr: 1.0e-5
  min_lr: 1.0e-7
  warmup_steps: 200
  anneal_steps: 1200
  device: "cuda"