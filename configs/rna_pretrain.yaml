# configs/rna_demo.yaml

data:
  dataset_path: "/home/rsun@ZHANGroup.local/rna_pretrain/hf_data/allen_23_training_new"
  test_size: 0.025
  seed: 42
  batch_size: 2048                                

model:
  feature_num:  32285
  hidden_params:  [1024, 512, 256]  
  # hidden_dim: 1024  
  # block_num: 8      
  embed_dim: 256      
  use_rmsnorm: true
  use_residual: true
  dropout_p: 0.0

training:
  project_dir: "outputs/rna_pretrain_musbrain"
  train_steps: 20000
  eval_points: 100
  save_points: 4000
  device: "cuda"

optimizer:
  lr: 5e-4
  warmup_steps: 1000
  steady_1_steps: 3000
  cosine_anneal_steps: 12000
  min_lr: 5e-6

loss:
  beta: 1.0