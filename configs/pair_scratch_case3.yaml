# pair_config.yaml

data:
  data_path: "/home/rsun@ZHANGroup.local/sr_project/eval_data/merge_dataset/mdata.h5mu"
  train_split_path: "/home/rsun@ZHANGroup.local/sr_project/eval_data/data_split/train_id_3.npy"
  test_split_path: "/home/rsun@ZHANGroup.local/sr_project/eval_data/data_split/test_id_3.npy"
  key_1: "rna_count"
  key_2: "peak_count"
  batch_size: 512

model:
  feature_num_1: null # 在脚本中动态确定
  feature_num_2: null # 在脚本中动态确定
  hidden_params_1: [1024,512,256]
  hidden_params_2: [1024,512,256]
  embed_dim: 256
  use_rmsnorm: true
  use_residual: true
  dropout_p: 0.0
  clip_temperature: 0.07

training:
  project_dir: "runs/pair_scratch_case3"
  train_steps: 10000
  eval_points: 80
  save_points: 500
  device: "cuda"

optimizer:
  lr: 1e-3
  warmup_steps: 1000
  steady_1_steps: 1600
  cosine_anneal_steps: 6000
  min_lr: 1e-4

loss:
  vae_beta_1: 1.0
  vae_beta_2: 1.0
  clip_weight: 40.0
  cross_recon_1: 0.4
  cross_recon_2: 0.4
  temperature: 0.07