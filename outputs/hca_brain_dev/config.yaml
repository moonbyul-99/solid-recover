# pair_config.yaml

data:
  train_data_path: '/home/rsun@ZHANGroup.local/solid-recover/data/multi_omics/hca_brain_dev/train.h5mu'
  test_data_path: '/home/rsun@ZHANGroup.local/solid-recover/data/multi_omics/hca_brain_dev/test.h5mu'
  key_1: "rna_count"
  key_2: "atac_count"
  batch_size: 512

model:
  feature_num_1: 17701 # 在脚本中动态确定
  feature_num_2: 141400 # 在脚本中动态确定
  hidden_params_1: [1024,256]
  hidden_params_2: [1024,256]
  embed_dim: 64
  use_rmsnorm: true
  use_residual: true
  dropout_p: 0.0

training:
  project_dir: "outputs/hca_brain_dev"
  train_steps: 10000
  eval_points: 12000
  save_points: 2000
  device: "cuda"

optimizer:
  lr: 1e-3
  warmup_steps: 1000
  steady_1_steps: 1600
  cosine_anneal_steps: 6000
  min_lr: 1e-4

loss:
  vae_beta_1: 1.0
  vae_beta_2: 1.0
  clip_weight: 40.0
  cross_recon_1: 0.7
  cross_recon_2: 0.7
  temperature: 0.12
  trainable_clip_temperature: False
  use_weight: True
  top_k_ratio: 0.1
  bottom_k_ratio: 0.1        
  weight_top: 0.1
  weight_bottom: 5.0