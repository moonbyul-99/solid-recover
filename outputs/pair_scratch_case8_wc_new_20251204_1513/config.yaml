# pair_config.yaml

data:
  train_data_path: "/home/rsun@ZHANGroup.local/solid-recover/data/case_8/train.h5mu"
  test_data_path: "/home/rsun@ZHANGroup.local/solid-recover/data/case_8/test.h5mu"
  key_1: "rna_count"
  key_2: "peak_count"
  batch_size: 512

model:
  feature_num_1: 11817 # 在脚本中动态确定
  feature_num_2: 65401 # 在脚本中动态确定
  hidden_params_1: [256,64]
  hidden_params_2: [256,64]
  embed_dim: 64
  use_rmsnorm: true
  use_residual: false
  dropout_p: 0.0

training:
  project_dir: "outputs/pair_scratch_case8_wc_new"
  train_steps: 10000
  eval_points: 160
  save_points: 500
  device: "cuda"

optimizer:
  lr: 5e-4
  warmup_steps: 1000
  steady_1_steps: 1000
  cosine_anneal_steps: 6000
  min_lr: 8e-5

loss:
  vae_beta_1: 1.0
  vae_beta_2: 1.0
  clip_weight: 40.0
  cross_recon_1: 0.75
  cross_recon_2: 0.75
  temperature: 0.12
  trainable_clip_temperature: False
  use_weight: True
  top_k_ratio: 0.1
  bottom_k_ratio: 0.1        
  weight_top: 0.1
  weight_bottom: 2.0