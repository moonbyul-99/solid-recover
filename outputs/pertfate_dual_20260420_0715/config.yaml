# pair_config.yaml

data:
  # train_data_path: "/home/rsun@ZHANGroup.local/sr-ai/sc_multi_4/dataset/mdata.h5mu"
  # test_data_path: "/home/rsun@ZHANGroup.local/sr-ai/sc_multi_4/dataset/mdata.h5mu"
  # train_data_path: "/home/rsun@ZHANGroup.local/sr-ai/pertfate/processed/_data/dual_data.h5mu"
  # test_data_path: "/home/rsun@ZHANGroup.local/sr-ai/pertfate/processed/_data/dual_data.h5mu"
  train_data_path: '/home/rsun@ZHANGroup.local/sr-ai/pertfate/processed/_data/dual_atac_rna_train.h5mu'
  test_data_path: '/home/rsun@ZHANGroup.local/sr-ai/pertfate/processed/_data/dual_atac_rna_test.h5mu'
  key_1: "rna"
  key_2: "atac"
  batch_size: 512
# (40445, 28196) (40445, 390752) (40445, 38609)
model:
  feature_num_1: 28196 #50000 #72805
  feature_num_2: 81934 #38609 #133173
  hidden_params_1: [1024, 256]
  hidden_params_2: [1024, 256]
  embed_dim: 64
  use_rmsnorm: true
  use_residual: false
  dropout_p: 0.0

training:
  project_dir: "outputs/pertfate_dual"
  train_steps: 16000
  eval_points: 80
  save_points: 1000
  device: "cuda"

optimizer:
  lr: 1e-3
  warmup_steps: 1000
  steady_1_steps: 1000
  cosine_anneal_steps: 10000
  min_lr: 1e-4

loss:
  vae_beta_1: 1.0
  vae_beta_2: 1.0
  clip_weight: 40.0
  cross_recon_1: 0.2
  cross_recon_2: 0.2
  temperature: 0.12
  trainable_clip_temperature: False
  use_weight: True
  top_k_ratio: 0.1
  bottom_k_ratio: 0.1        
  weight_top: 0.1
  weight_bottom: 5.0