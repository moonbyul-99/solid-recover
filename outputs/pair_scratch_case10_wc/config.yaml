# pair_config.yaml

data:
  train_data_path: "/home/rsun@ZHANGroup.local/solid-recover/data/case_10/train.h5mu"
  test_data_path: "/home/rsun@ZHANGroup.local/solid-recover/data/case_10/test.h5mu"
  key_1: "rna_count"
  key_2: "peak_count"
  batch_size: 512

model:
  feature_num_1: 15868
  feature_num_2: 79064
  hidden_params_1: [1024,  256]
  hidden_params_2: [1024,  256]
  embed_dim: 64
  use_rmsnorm: true
  use_residual: true
  dropout_p: 0.0

training:
  project_dir: "outputs/pair_scratch_case10_wc"
  train_steps: 8000
  eval_points: 120
  save_points: 500
  device: "cuda"

optimizer:
  lr: 1e-3
  warmup_steps: 800
  steady_1_steps: 1600
  cosine_anneal_steps: 5600
  min_lr: 1e-4

loss:
  vae_beta_1: 1.0
  vae_beta_2: 1.0
  clip_weight: 40.0
  cross_recon_1: 0.4
  cross_recon_2: 0.4
  temperature: 0.07
  trainable_clip_temperature: False
  use_weight: True
  top_k_ratio: 0.1
  bottom_k_ratio: 0.1        
  weight_top: 0.1
  weight_bottom: 2.0